gameId = "sokoban"
displayName = "Sokoban"
windowTitleHints = ["sokoban", "push box", "pushbox"]
loadGuardPolicy = "force-disable"

observationFocus = [
	"忽略棋盘外的页面 UI 和装饰元素；主要关注棋盘区域、玩家、箱子、目标点、墙、可行走地砖和被阻挡的路径。",
	"浅灰色地砖是棋盘内的可行走区域。",
	"深灰色、带 X 凸起纹理的方块是墙 / 障碍物，不能穿过，也不能推动。",
	"箱子是可以推动的物体，但不能拉回。",
	"绿色菱形标记是目标点。",
	"已经推到目标点上的箱子会显示为绿色、带叉的箱子。",
	"右上角紫红色的圆圈箭头按钮是重置按钮；点击它可以重新开始当前关卡。只有在明显卡死或长期无进展时才允许使用。",
	"右上角绿色的撤销 / 回退一步按钮禁止使用，不要把它作为正常动作或恢复手段。",
	"玩家角色的逻辑位置就是其当前所在格，不存在上下两格的 foot-row offset；在棋盘草图中直接把 P 标在玩家所在格。",
	"描述玩家位置时，优先说明其相对最近墙体、箱子、目标点或可通行地砖的位置，不要泛泛描述整个画面。",
	"sparse 棋盘上相邻行之间容易混淆；画棋盘草图前必须逐行数清 P/B/T 的精确行号，不得跨行推定。",
	"在提出下一步动作前，必须先确认动作方向上的相邻格：如果相邻格是墙，或者是无法继续推动的箱子链，则不要选择该动作。",
	"如果要推动箱子，必须同时确认箱子后方一格是否可进入；只有箱子后方是可行走地砖或目标点时，推动才可能成立。",
	"如果某个普通箱子 B 被推到贴墙且形成角落式阻塞位（例如贴外墙且上/下/旁边又被墙或已完成箱子封住），应优先视为死局，而不是继续乱走。",
	"复杂关卡允许为解题先创造中间态：某个箱子可以暂时停在非最终位置，甚至暂时占住一个目标点后再被推出；不要把“一个箱子到达目标点”自动当作最终方案已经定型。",
	"静态画面清晰时，优先给出 3-8 步以内的短动作序列，而不是只给一个模糊方向。",
	"用具体推箱子术语说明进展：玩家位置、箱子位置、目标点位置、箱子是否更接近目标、是否打开或堵住路径。",
	"区分纯粹移动玩家、调整站位、推动箱子、让箱子接近目标、箱子上目标点、以及完全没有移动。",
	"不要把“玩家移动了”自动视为关卡进展；必须说明该移动是否创造了有用站位。",
	"不要只说“继续移动”或“尝试移动”；下一步必须绑定到具体的箱子、目标点、墙边或可通行格。",
	"始终用固定符号构建紧凑棋盘草图：#=墙, .=地砖, P=玩家, B=箱子, T=目标点, *=箱子在目标点, +=玩家在目标点。不要使用 W/_ 或其他非标准符号。",
	"如果当前画面中无法可靠识别玩家、箱子、目标点或墙体，必须承认不确定，不要凭空补全棋盘。",
	"比较前后状态时，如果棋盘在网格级别没有可确认变化，就视为没有进展；不要仅因为按过方向键就推断发生了移动。",
]

defaultActionOrder = ["move_up", "move_left", "move_right", "move_down"]
notes = [
	"只能推动箱子，不能拉箱子。",
	"避免把箱子推入无法恢复的位置，尤其是非目标点角落或死路。",
	"如果选择方向上的相邻格是墙，该动作无效，不应选择。",
	"如果相邻格是箱子，必须检查箱子后方一格；后方不是可行走地砖或目标点时，不应推动。",
	"优先选择能产生可见进展或改善站位的动作，避免反复撞墙或原地试错。",
	"当短安全序列清晰可用时，可以一次选择 3-8 步，但每一步都必须基于当前棋盘布局。",
	"如果动作只是调整玩家站位，必须明确说明，不要夸大成箱子进展。",
	"任何声称推动箱子的判断，都必须能在 afterStateSketch 中看到箱子位置变化；否则视为未确认推动。",
	"箱子被推到绿色菱形目标点后，应在草图中标记为 *。",
	"只有在明确卡死或长期停滞时，才允许点击右上角洋红色 / 紫红色重置按钮。",
	"如果局面已形成明显死局，不要继续试探性乱走；应把当前思路记为错误路线，并重置本关重新尝试另一条开局。",
	"禁止使用右上角绿色撤销 / 回退按钮。",
]

[delegationProfile]
profileId = "delegation"
taskId = "delegation-generic"
displayName = "Generic Delegation"
maxRounds = 20
maxActionsPerRound = 8
afterActionWaitMs = 700
plannerSpeechLeadMs = 2000
allowedTools = [
	"host.focus_window",
	"host.capture_window",
	"host.send_key",
	"host.send_mouse",
]

[delegationProfile.locator]
# 当前推箱子验证改为纯云端链路：
# - 关闭 rule locator
# - 关闭 local vision locator fallback
# - 仅保留 cloud locator
# 如需回退到旧逻辑，可恢复：
#   locatorRulesEnabled = true
#   locatorCloudEnabled = false
#   locatorLocalFallbackEnabled = true
locatorRulesEnabled = false
locatorCloudEnabled = true
locatorLocalFallbackEnabled = false
locatorMinConfidence = 0.6

[delegationProfile.roles.missionAnalyst]
missionAnalystTemperature = 0.1
missionAnalystThinkingMode = "medium"
missionAnalystRules = [
	"如果任务是推箱子操作，必须标注 taskMode=game。",
	"目标要聚焦当前关卡推进，不要输出与关卡无关回答。",
	"在 initialStateSketch 中用纯文本画出当前识别到的棋盘局面，至少标清 P/B/T/#/./*/+ 这些元素里能确认的部分。",
	"玩家 P 标在玩家当前所在格；不要使用脚下行 offset，也不要把玩家拆成上下两格。",
	"棋盘表示必须使用标准符号：# 墙, . 地砖, P 玩家, B 箱子, T 目标点, * 箱子在目标点, + 玩家在目标点。不要使用 W/_ 等非标准符号。",
	"如果玩家、箱子、目标点或墙体仍有歧义，必须直接承认歧义，不要补齐一个自信但未经确认的棋盘。",
	"sparse 棋盘上相邻行容易混淆；构建 initialStateSketch 时必须逐行确认每个 P/B/T 的精确行号，不得跨行推定。",
	"深灰色带 X 的方块是墙；浅灰色地砖是可行走区域；绿色菱形是目标点；绿色带叉的箱子表示箱子已经在目标点上。",
	"右上角紫红色圆圈箭头按钮是重置关卡按钮，点击可重新开始当前关卡；仅在卡死时允许；右上角绿色回退按钮禁止使用。",
]

[delegationProfile.roles.operationsPlanner]
operationsPlannerTemperature = 0.1
operationsPlannerThinkingMode = "medium"
operationsPlannerRules = [
	"优先使用 game.perform_action；若不可用再考虑 host.send_key；只有确认需要重开时才考虑点击右上角洋红色 / 紫红色重置按钮。",
	"当 evaluator / latestHint 明确指出 deadlock、死局、卡死、或要求 restart 时，下一轮应优先执行一次 host.send_mouse 点击右上角紫红色/偏粉红色重置按钮，并在 reasoning 中说明上一条错误路线是什么。",
	"禁止使用右上角绿色撤销 / 回退按钮。",
	"每轮最多 8 个动作，但必须是安全动作序列，不能跨越大量未知局面。",
	"reasoning 与 stateSketch 必须基于当前观察到的棋盘局面，而不是基于希望发生的移动。",
	"stateSketch 中必须逐行标注 P/B/T 的行列位置；sparse 棋盘上一行之差会导致无效动作，不得跨行推定。",
	"棋盘表示必须使用标准符号：# 墙, . 地砖, P 玩家, B 箱子, T 目标点, * 箱子在目标点, + 玩家在目标点。不要使用 W/_ 等非标准符号。",
	"下一个动作必须明确对应具体局面目标，例如让 P 靠近哪个 B、把哪个 B 推向哪个 T、或把 B 推到 T 上。",
	"推动箱子前必须检查箱子后方一格是否可走；若后方是墙、箱子或棋盘外区域，则不要选择该推动。",
	"如果最近连续两轮都没有确认 stateDelta，就先重建 stateSketch，并明确换一个局面目标；不要沿用同一套方向套路。",
	"如果普通箱子 B 被推到贴墙且相邻方向又被墙/已完成箱子封住，导致剩余目标无法继续推进，应停止继续乱走，直接规划重置本关。",
	"每轮都要明确 currentPhaseGoal：说明本轮要创造什么中间态，例如“先拆开上下箱子”“先把下箱移到可继续操作的位置”“先腾出上箱的活动空间”。不要只盯着“把某箱立即推到目标点”。",
	"whyThisPhase 必须解释为什么当前先做这个阶段；abortCondition 必须说明什么情况说明这条阶段策略该放弃或重开。",
	"允许把箱子暂时推到目标点后再推出，只要这是为后续整体解法服务的中间态；不要把单个箱子到位直接视为整关完成。",
]

[delegationProfile.roles.progressEvaluator]
progressEvaluatorTemperature = 0.1
progressEvaluatorThinkingMode = "medium"
progressEvaluatorRules = [
	"判断动作是否让玩家或箱子状态发生了有效推进。",
	"棋盘表示必须使用标准符号：# 墙, . 地砖, P 玩家, B 箱子, T 目标点, * 箱子在目标点, + 玩家在目标点。不要使用 W/_ 等非标准符号。",
	"beforeStateSketch 与 afterStateSketch 必须用纯文本画出识别到的棋盘局面，至少标清 P/B/T/#/./*/+ 这些元素里能确认的部分。",
	"stateDelta 必须明确说明哪些格子或相对位置发生了变化；如果棋盘基本没变，就明确写“无可确认变化”。",
	"如果箱子从普通位置移动到绿色菱形目标点上，afterStateSketch 中应把该格标记为 *。",
	"即使 stateDelta 中声称了变化，如果 beforeStateSketch 和 afterStateSketch 在网格级别完全相同，仍必须判定 actionSucceeded=false。",
	"如果 before/after 没有可确认变化，则 actionSucceeded=false、expectedMet=false、goalProgress=none，不得判成功。",
	"不要从“按了某个方向键”反推出玩家或箱子已经移动；只有在 after 局面中可见变化时才算移动成立。",
	"如果局面连续两轮没有可确认变化，nextHint 必须要求重新定位 P/B/T/# 并换一个局面目标，不能只说“再试一次”。",
	"若 before/after 棋盘完全一致且有证据表明按键已发出（actionSucceeded 记录中可以看到），应优先判定移动被墙阻挡、站位错误或棋盘识别仍有歧义，而不是立刻归因于窗口焦点丢失。",
	"只有在连续多次不同方向按键都无任何可确认变化时，nextHint 才可考虑重新聚焦；禁止给出'点击窗口中心'这类笼统建议，必须说明具体要验证的焦点或局面问题。",
	"如果某个普通箱子 B 被推到贴墙且相邻方向又被墙/已完成箱子封住，导致剩余目标不可能在当前局面完成，则应明确判定为死局；nextHint 必须要求点击右上角紫红色/偏粉红色重置按钮，并说明是哪一步错误地把箱子推入死局。",
	"phaseStatus 必须反映当前阶段目标是否推进：advanced=更接近当前阶段中间态，stalled=没推进，blocked=当前阶段已走死或应放弃，completed=当前阶段目标完成但整关未必完成。",
	"如果 currentPhaseGoal 完成了，但棋盘仍有未完成目标或下一步还必须继续移动其他箱子，goalProgress 只能是 partial，phaseStatus 可以是 completed；不要把阶段完成误判成整关完成。",
]

[[actions]]
id = "move_up"
label = "Up"
description = "Move the player up once, pushing a box only if the path allows it."

[[actions.steps]]
kind = "send-key"
key = "Up"

[[actions]]
id = "move_left"
label = "Left"
description = "Move the player left once, pushing a box only if the path allows it."

[[actions.steps]]
kind = "send-key"
key = "Left"

[[actions]]
id = "move_right"
label = "Right"
description = "Move the player right once, pushing a box only if the path allows it."

[[actions.steps]]
kind = "send-key"
key = "Right"

[[actions]]
id = "move_down"
label = "Down"
description = "Move the player down once, pushing a box only if the path allows it."

[[actions.steps]]
kind = "send-key"
key = "Down"

