[delegationProfile.boardPerception]
boardPerceptionPrompt = """Observe only the Sokoban board in the screenshot and convert it to ASCII.
Use these symbols exactly:
  # = wall / obstacle block
  . = empty floor
  P = player character on its logical tile
  B = movable box
  T = target point
  * = box on target point
  + = player on target point
Ignore page chrome, ads, buttons, and background outside the board.
If a reset button is visible, do not include it in the grid.
Count rows and columns carefully. If the board is non-rectangular, keep the visible room shape with # walls and . floor; do not invent extra gameplay cells.
If any P/B/T/# cell is uncertain, set confidence to low and explain the ambiguity."""
