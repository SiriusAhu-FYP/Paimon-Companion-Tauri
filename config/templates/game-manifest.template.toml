# Semantic game manifest template
# Keep action definitions concise: what the action does + key/mouse mapping.

gameId = "example-game"
displayName = "Example Game"
windowTitleHints = ["example game"]
loadGuardPolicy = "force-disable"   # auto | force-enable | force-disable

observationFocus = ["Describe board state and actionable cues only."]

defaultActionOrder = ["move_up", "move_left", "move_right", "move_down"]
notes = ["Game-specific strategy notes in natural language."]

[delegationProfile]
profileId = "game-example"
taskId = "game-example-generic"
displayName = "Generic Example Delegation"
maxRounds = 20
maxActionsPerRound = 1
afterActionWaitMs = 700
allowedTools = ["host.focus_window", "host.capture_window", "host.send_key"]

[delegationProfile.locator]
locatorRulesEnabled = true
locatorCloudEnabled = true
locatorLocalFallbackEnabled = false
locatorMinConfidence = 0.6

[delegationProfile.roles.missionAnalyst]
missionAnalystTemperature = 0.1
missionAnalystThinkingMode = "medium"
missionAnalystRules = ["Constrain the goal to this game and current level."]

[delegationProfile.roles.operationsPlanner]
operationsPlannerTemperature = 0.1
operationsPlannerRules = ["Prefer one grounded action per round."]

[delegationProfile.roles.progressEvaluator]
progressEvaluatorTemperature = 0.1
progressEvaluatorRules = ["State whether the move caused real progress."]

[[actions]]
id = "move_up"
label = "Up"
description = "Move up once."

[[actions.steps]]
kind = "send-key"
key = "Up"
